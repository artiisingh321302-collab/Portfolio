<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="profileTitle">
  <title id="profileTitle">Arati Singh profile photo placeholder</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d142b" />
      <stop offset="0.55" stop-color="#0b1022" />
      <stop offset="1" stop-color="#170f33" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="0.5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#94a3b8" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)" />
  <rect width="800" height="1000" fill="url(#grid)" />
  <circle cx="630" cy="210" r="330" fill="url(#glow)" />
  <circle cx="150" cy="850" r="280" fill="url(#glow)" opacity="0.35" />

  <g fill="none" stroke="#a78bfa" stroke-opacity="0.34">
    <circle cx="400" cy="430" r="230" />
    <circle cx="400" cy="430" r="180" stroke-dasharray="6 10" />
    <circle cx="400" cy="430" r="132" stroke-opacity="0.18" />
  </g>

  <circle cx="400" cy="430" r="104" fill="url(#accent)" opacity="0.95" />
  <circle cx="400" cy="430" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.22" />
  <text x="400" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="700" fill="#ffffff">AS</text>

  <g fill="#38bdf8">
    <circle cx="400" cy="200" r="6" />
    <circle cx="630" cy="430" r="5" />
    <circle cx="170" cy="430" r="4" />
    <circle cx="470" cy="655" r="5" />
  </g>

  <text x="400" y="758" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="10" fill="#c7d2fe" fill-opacity="0.72">YOUR PHOTO</text>
  <text x="400" y="800" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8" fill-opacity="0.7">PROFILE IMAGE PLACEHOLDER</text>
  <path d="M120 930H680" stroke="#94a3b8" stroke-opacity="0.16" />
</svg>
